<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>麻将对局界面高还原示例</title>
  <style>
    :root {
      --tile-w: clamp(34px, 3vw, 52px);
      --tile-h: calc(var(--tile-w) * 1.36);
      --hand-w: clamp(48px, 4.2vw, 78px);
      --hand-h: calc(var(--hand-w) * 1.42);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 15%, #243454 0%, transparent 35%), #060d1a;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      padding: 12px;
    }

    .board {
      width: min(1280px, 100vw - 24px);
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #5e301d, #915532 55%, #3d2013);
      border-radius: 22px;
      padding: clamp(10px, 1.4vw, 16px);
      box-shadow: 0 18px 45px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,210,140,.2);
    }

    .table {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1f8d6b 0%, #0d5d49 65%, #0a4f3f 100%);
      box-shadow: inset 0 0 55px rgba(0,0,0,.55);
    }

    .status {
      position: absolute;
      top: 1.2%;
      left: 1.2%;
      font-size: clamp(14px, 1.55vw, 30px);
      line-height: 1.3;
      padding: .45em .65em;
      border-radius: 12px;
      background: rgba(6,9,14,.64);
      border: 1px solid rgba(255,255,255,.12);
      color: #f6bb67;
      font-weight: 700;
      z-index: 5;
    }
    .status span { display: block; margin-top: .25em; color: #c6a68a; font-size: .8em; }

    .corner-actions {
      position: absolute;
      top: 1.3%;
      right: 1.3%;
      display: flex;
      gap: clamp(6px, .7vw, 10px);
      z-index: 5;
    }

    .icon-btn {
      width: clamp(28px, 3.8vw, 56px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: clamp(14px, 1.8vw, 28px);
      background: radial-gradient(circle at 35% 30%, #51463f, #231d19 70%);
      border: 1px solid rgba(255,236,188,.32);
      color: #d5b981;
    }

    .player {
      position: absolute;
      display: flex;
      align-items: center;
      gap: .5em;
      padding: .4em .55em;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(7,10,16,.68);
      font-size: clamp(12px, 1.15vw, 22px);
      z-index: 4;
      min-width: clamp(120px, 16vw, 215px);
    }

    .avatar {
      width: clamp(24px, 3.7vw, 52px);
      height: clamp(24px, 3.7vw, 52px);
      border-radius: 10px;
      background: linear-gradient(145deg, #f5f8fc, #96aec9);
      display: grid;
      place-items: center;
      color: #2d3d58;
      font-weight: 800;
    }

    .meta { font-weight: 700; }
    .coin { display: block; color: #f4be58; font-size: .95em; margin-top: .1em; }

    .north { left: 50%; top: 2.3%; transform: translateX(-50%); }
    .west { left: 1.2%; top: 39%; }
    .east { right: 1.2%; top: 39%; }
    .self { left: 1.4%; bottom: 16%; border: 2px solid #ffcc55; box-shadow: 0 0 14px rgba(255,204,82,.45); }

    .wall { position: absolute; display: flex; gap: 2px; z-index: 2; }
    .wall.top { top: 12%; left: 50%; transform: translateX(-50%); }
    .wall.left { left: 11.5%; top: 51%; transform: translateY(-50%) rotate(-90deg); }
    .wall.right { right: 11.5%; top: 51%; transform: translateY(-50%) rotate(90deg); }

    .back {
      width: clamp(20px, 2.6vw, 42px);
      height: clamp(30px, 3.7vw, 58px);
      border-radius: 6px;
      background: linear-gradient(180deg, #8dcd52, #4f9f28);
      border: 1px solid rgba(255,255,255,.32);
    }

    .discard { position: absolute; display: flex; gap: 4px; z-index: 3; }
    .discard.top { top: 30%; left: 50%; transform: translateX(-50%); }
    .discard.left { left: 39%; top: 50%; transform: translateY(-50%) rotate(-90deg); }
    .discard.right { right: 39%; top: 50%; transform: translateY(-50%) rotate(90deg); }

    .tile {
      width: var(--tile-w);
      height: var(--tile-h);
      border-radius: 7px;
      border: 1px solid #d6d0c2;
      background: #f1ece2;
      display: grid;
      place-items: center;
      color: #1e1e1e;
      font-size: clamp(16px, 2vw, 30px);
      font-weight: 800;
      box-shadow: 0 3px 6px rgba(0,0,0,.25);
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(150px, 22vw, 290px);
      aspect-ratio: 1.5 / 1;
      border-radius: 24px;
      background: linear-gradient(180deg, #2d323a, #101419);
      border: 2px solid #565d66;
      box-shadow: inset 0 0 14px rgba(0,0,0,.85), 0 8px 16px rgba(0,0,0,.4);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 2px;
      z-index: 4;
    }
    .round { font-size: clamp(14px, 2vw, 34px); color: #b99761; font-weight: 700; }
    .remain { font-size: clamp(30px, 4.2vw, 72px); color: #4ac4ff; font-weight: 900; line-height: 1; }
    .count { font-size: clamp(14px, 1.9vw, 28px); color: #d9b975; font-weight: 700; }

    .turn-tip {
      position: absolute;
      left: 24%;
      bottom: 21%;
      font-size: clamp(14px, 2vw, 36px);
      color: #f8d264;
      font-weight: 800;
      z-index: 4;
    }

    .actions {
      position: absolute;
      left: 50%;
      bottom: 17%;
      transform: translateX(-50%);
      display: flex;
      gap: clamp(6px, .8vw, 12px);
      z-index: 4;
    }

    .act {
      width: clamp(64px, 11vw, 164px);
      height: clamp(32px, 5.2vw, 82px);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: clamp(20px, 3.5vw, 54px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 3px rgba(0,0,0,.35);
      box-shadow: 0 8px 16px rgba(0,0,0,.3), inset 0 0 0 2px rgba(255,255,255,.24);
    }
    .hu { background: linear-gradient(180deg, #ff6554, #ca2719); }
    .peng { background: linear-gradient(180deg, #ffbf42, #d47b00); }
    .gang { background: linear-gradient(180deg, #61d56f, #1f9f30); }
    .pass { background: linear-gradient(180deg, #49b6ff, #146dbf); }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 1.2%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      padding: 6px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,224,106,.38), rgba(255,224,106,.12));
      box-shadow: 0 0 14px rgba(255,213,83,.45);
      z-index: 4;
      max-width: 96%;
    }

    .hand .tile {
      width: var(--hand-w);
      height: var(--hand-h);
      font-size: clamp(20px, 2.8vw, 46px);
      padding: 0;
    }

    .hand .tile.selected {
      transform: translateY(calc(var(--hand-h) * -0.28));
      box-shadow: 0 0 0 3px rgba(255,218,96,.95), 0 12px 18px rgba(0,0,0,.35);
    }

    .left-arrow {
      position: absolute;
      left: .9%;
      bottom: 35%;
      width: clamp(24px, 3.2vw, 48px);
      height: clamp(42px, 6.5vw, 84px);
      border-radius: 999px;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,.2);
      display: grid;
      place-items: center;
      font-size: clamp(18px, 2.8vw, 52px);
      color: #d6ad6f;
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="table">
      <div class="status">血流成河 · 底分 100<span>房间号：888888</span></div>
      <div class="corner-actions"><div class="icon-btn">?</div><div class="icon-btn">⚙</div><div class="icon-btn">↩</div></div>

      <div class="player north"><div class="avatar">北</div><div class="meta">风徐来<span class="coin">25,600</span></div></div>
      <div class="player west"><div class="avatar">西</div><div class="meta">明月几时有<span class="coin">18,400</span></div></div>
      <div class="player east"><div class="avatar">东</div><div class="meta">南山南<span class="coin">31,200</span></div></div>
      <div class="player self"><div class="avatar">南</div><div class="meta">你<span class="coin">28,800</span></div></div>

      <div class="wall top" id="wallTop"></div>
      <div class="wall left" id="wallLeft"></div>
      <div class="wall right" id="wallRight"></div>

      <div class="discard top"><div class="tile">🀇</div><div class="tile">🀅</div><div class="tile">🀜</div><div class="tile">🀝</div><div class="tile">🀙</div></div>
      <div class="discard left"><div class="tile">🀄</div><div class="tile">🀈</div><div class="tile">🀋</div><div class="tile">🀁</div></div>
      <div class="discard right"><div class="tile">🀂</div><div class="tile">🀉</div><div class="tile">🀜</div><div class="tile">🀞</div></div>

      <div class="center"><div class="round">东风圈</div><div class="remain">08</div><div class="count">剩 52 张</div></div>
      <div class="turn-tip">轮到你出牌 ➜</div>
      <div class="actions"><button class="act hu">胡</button><button class="act peng">碰</button><button class="act gang">杠</button><button class="act pass">过</button></div>

      <div class="left-arrow">›</div>
      <div class="hand" id="hand"></div>
    </div>
  </div>

  <script>
    const createWall = (id, count) => {
      const wrap = document.getElementById(id);
      for (let i = 0; i < count; i += 1) {
        const el = document.createElement('div');
        el.className = 'back';
        wrap.appendChild(el);
      }
    };

    createWall('wallTop', 16);
    createWall('wallLeft', 15);
    createWall('wallRight', 15);

    const tiles = ['二万', '三万', '五万', '六万', '七万', '八万', '九万', '九万', '二筒', '四筒', '六条', '东', '南', '发'];
    const hand = document.getElementById('hand');

    tiles.forEach((text, i) => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile';
      tile.textContent = text;
      if (i === 10) tile.classList.add('selected');
      tile.addEventListener('click', () => {
        document.querySelectorAll('.hand .tile').forEach(t => t.classList.remove('selected'));
        tile.classList.add('selected');
      });
      hand.appendChild(tile);
    });
  </script>
</body>
</html>
